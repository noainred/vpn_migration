[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinc-route-analyzer"
version = "1.0.0"
description = "Analyse tinc VPN logs to map node-to-node traffic and routes for migration to NSX VPN"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["tinc", "vpn", "nsx", "log-analysis", "network", "migration"]

# Pure standard library — no runtime dependencies.
dependencies = []

[project.scripts]
tinc-route-analyzer = "tinc_route_analyzer.cli:main"

[tool.setuptools]
packages = ["tinc_route_analyzer"]
